[package]
name = "flip_seven"
version = "0.1.0"
edition = "2024"
default-run = "flip_seven"
license = "MIT"
description = "A Flip Seven scorekeeper and probability companion for desktop and web"

[features]
default = ["simulation"]
simulation = ["dep:clap", "dep:csv", "dep:rayon", "dep:serde", "dep:serde_json"]

[[bin]]
name = "offline"
path = "src/bin/offline.rs"
required-features = ["simulation"]

[dependencies]
eframe = "0.32"
rand = "0.9"
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.5", features = ["derive"], optional = true }
csv = { version = "1.3", optional = true }
rayon = { version = "1.10", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }

[profile.release]
opt-level = 2
lto = "thin"
