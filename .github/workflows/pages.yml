name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NO_COLOR: "true"

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Linux GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --bin flip_seven -- -D warnings
      - name: Install Trunk
        run: cargo install trunk --locked --version 0.21.14
      - name: Build web app
        run: trunk build --release
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
