<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f2327">
    <meta name="description" content="Flip Seven scorekeeper and probability companion.">
    <title>Flip Seven</title>
    <link data-trunk rel="rust" data-bin="flip_seven" data-cargo-no-default-features>
    <link data-trunk rel="copy-dir" href="web/assets" data-target-path="assets">
    <link data-trunk rel="copy-file" href="web/manifest.webmanifest">
    <link data-trunk rel="copy-file" href="web/register.js">
    <link data-trunk rel="copy-file" href="web/third-party-licenses.html">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" href="./assets/icon-192.png">
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1f2327; color: #ebe8e0; font-family: system-ui, sans-serif; }
      #app { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); }
      canvas { width: 100%; height: 100%; display: block; touch-action: none; }
      #loading { position: absolute; inset: 0; display: grid; place-content: center; padding: 24px; text-align: center; pointer-events: none; }
    </style>
  </head>
  <body>
    <main id="app">
      <canvas id="flip-seven" aria-label="Flip Seven game"></canvas>
      <div id="loading" role="status">Loading Flip Seven...</div>
    </main>
    <noscript>JavaScript is required to run Flip Seven.</noscript>
    <script src="./register.js" defer></script>
  </body>
</html>
